name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build (Jellyfin 12 and 10.11)
        run: dotnet build Jellyfin.Plugin.Marquee/Jellyfin.Plugin.Marquee.csproj -c Release
      - name: Test
        run: dotnet test Jellyfin.Plugin.Marquee.Tests -c Release
