name: Release

# Publishing a GitHub release builds both zips, attaches them, and adds them to manifest.json,
# the plugin repository Jellyfin installs and updates from.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test Jellyfin.Plugin.Marquee.Tests -c Release
      - name: Build and package
        run: python3 scripts/package.py "$TAG"
      - name: Attach to the release
        run: gh release upload "$TAG" dist/*.zip --clobber
      - name: Publish in the plugin repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add $TAG to the plugin repository"
          git push origin HEAD:main
